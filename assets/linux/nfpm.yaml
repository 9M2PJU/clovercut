# Clovercut's Linux packages: one description for the .deb and the .rpm.
#
# Built by build-app.yml with nfpm from the staged folder the AppImage is
# also made of, so every Linux bundle ships the same files. The program lives
# whole under /opt/clovercut - the binary finds its libraries in lib/ beside
# itself, by rpath, and nothing else on the system has to line up - with
# a launcher on the path, a desktop entry and an icon where the desktop
# looks for them. The version and architecture are handed in as
# environment; the files are named relative to the staged folder, which
# is where nfpm is run from:
#
#   cd stage/Clovercut-0.1.8-linux-x86_64
#   VERSION=0.1.8 NFPM_ARCH=amd64 nfpm package -f ../../assets/linux/nfpm.yaml -p deb -t ..
name: clovercut
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: video
priority: optional
maintainer: Clovercut contributors <https://github.com/tulcoturo/clovercut>
vendor: Clovercut contributors
homepage: https://github.com/tulcoturo/clovercut
license: AGPL-3.0-or-later
description: |
  Desktop-first, open-source video editor with local AI.
  Timeline editing, effects, transitions, titles and on-device captions,
  with FFmpeg underneath and hardware-accelerated preview and export.

contents:
  - src: clovercut
    dst: /opt/clovercut/clovercut
    file_info:
      mode: 0755
  - src: lib/*
    dst: /opt/clovercut/lib/
  - src: pkg/clovercut
    dst: /usr/bin/clovercut
    file_info:
      mode: 0755
  - src: pkg/io.github.tulcoturo.clovercut.desktop
    dst: /usr/share/applications/io.github.tulcoturo.clovercut.desktop
  - src: clovercut.png
    dst: /usr/share/icons/hicolor/256x256/apps/clovercut.png
  - src: LICENSE
    dst: /usr/share/doc/clovercut/LICENSE
  - src: THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/clovercut/THIRD_PARTY_NOTICES.md

# What the binary loads from the system rather than from lib/: the
# toolkit the file dialogs use, sound, fonts and OpenGL. Named as each
# family names them.
overrides:
  deb:
    depends:
      - libc6
      - libgtk-3-0
      - libfontconfig1
      - libfreetype6
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libgl1
      - libasound2 | libasound2t64
  rpm:
    depends:
      - gtk3
      - fontconfig
      - freetype
      - libxkbcommon
      - libxkbcommon-x11
      - mesa-libGL
      - alsa-lib
