name: Publish validated 0.1.6 packages
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-validated-016
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify successful package jobs and exact tested source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in original:40217598855 mac:40231600248 ci:40231598416; do
            name=${pair%%:*}; run=${pair##*:}
            gh api "repos/tulcoturo/clovercut/actions/runs/$run" > "$name.json"
            gh api "repos/tulcoturo/clovercut/actions/runs/$run/jobs" > "$name-jobs.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          load = lambda name: json.loads(Path(name).read_text())
          original = load('original.json')
          assert original['head_sha'] == '1457f51461abebfb5f1ae8c0fa41109dea923ca2'
          assert original['status'] == 'completed'
          jobs = {j['name']: j for j in load('original-jobs.json')['jobs']}
          for name in ['build / linux-x86_64', 'build / linux-aarch64', 'build / windows-x86_64', 'build / windows-aarch64', 'build / macos-arm64']:
              assert jobs[name]['conclusion'] == 'success', name
          for kind, job_name, workflow in [('ci', 'Engine tests and lints', '.github/workflows/ci.yml'), ('mac', 'macos-x86_64', '.github/workflows/build-app.yml')]:
              run = load(kind + '.json')
              assert run['status'] == 'completed' and run['conclusion'] == 'success', kind
              assert run['head_sha'] == '72c1359d0c94574f5ab404cc58ec38919c258d03', kind
              assert run['path'] == workflow and run['event'] == 'workflow_dispatch', kind
              job = next(j for j in load(kind + '-jobs.json')['jobs'] if j['name'] == job_name)
              assert job['conclusion'] == 'success', job_name
              Path(kind + '-job-id').write_text(str(job['id']))
          PY
          for name in ci mac; do
            gh api --allow-escape-sequences "repos/tulcoturo/clovercut/actions/jobs/$(cat "$name-job-id")/logs" > "$name.log"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          expected = '1457f51461abebfb5f1ae8c0fa41109dea923ca2'
          for name in ['ci', 'mac']:
              log = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', Path(name + '.log').read_text())
              match = re.search(r'git log -1 --format=%H\r?\n[^\n]*Z ([0-9a-f]{40})\s*\n', log)
              assert match and match[1] == expected, (name, 'checked-out source differs')
          print('All six packages and full CI passed on the exact v0.1.6 source.')
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 40217598855
          pattern: Clovercut-*
          merge-multiple: true
          path: bundles
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 40231600248
          name: Clovercut-macos-x86_64
          path: bundles
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v0.1.6
          path: source
      - name: Verify packages, manifest, checksums and provenance
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = 1457f51461abebfb5f1ae8c0fa41109dea923ca2
          python3 source/scripts/models.py release-manifest --version 0.1.6 --tag v0.1.6 --bundles bundles --out bundles/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('bundles')
          expected = {'Clovercut-0.1.6-' + suffix for suffix in ['x86_64.AppImage', 'aarch64.AppImage', 'windows-x86_64-setup.exe', 'windows-x86_64-portable.zip', 'windows-aarch64-setup.exe', 'windows-aarch64-portable.zip', 'macos-arm64.dmg', 'macos-x86_64.dmg']}
          assert {p.name for p in root.iterdir()} == expected | {'manifest.json'}
          assert all((root / name).stat().st_size > 0 for name in expected)
          p = root / 'manifest.json'; data = json.loads(p.read_text())
          data['build_provenance'] = {name: {'commit': '1457f51461abebfb5f1ae8c0fa41109dea923ca2', 'run_url': 'https://github.com/tulcoturo/clovercut/actions/runs/' + ('40231600248' if name.endswith('macos-x86_64.dmg') else '40217598855')} for name in sorted(expected)}
          data['ci_run_url'] = 'https://github.com/tulcoturo/clovercut/actions/runs/40231598416'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          (cd bundles && sha256sum Clovercut-* manifest.json > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: v0.1.6
          name: Clovercut v0.1.6
          draft: false
          prerelease: false
          make_latest: true
          body_path: docs/releases/0.1.6.md
          fail_on_unmatched_files: true
          files: bundles/*
